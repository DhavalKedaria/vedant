<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoEngine Dashboard</title>
    <style>
        /* --- 1. Global Reset & Modern Variables --- */
        :root {
            --primary: #FF0080;
            --secondary: #7928CA;
            --accent: #00DFD8;
            --bg-body: #f7f9fc;
            --text-main: #1A202C;
            --text-muted: #718096;
            --card-bg: #ffffff;
            --font-stack: 'Inter', system-ui, -apple-system, sans-serif;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-body);
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- 2. The Navbar --- */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .brand svg { stroke: var(--secondary); }
        .header-actions { display: flex; align-items: center; gap: 15px; }

        .search-input {
            background: #f1f5f9;
            border: 1px solid transparent;
            border-radius: 50px;
            padding: 10px 20px;
            font-size: 0.9rem;
            width: 250px;
            transition: all 0.2s;
        }
        .search-input:focus {
            background: white;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(121, 40, 202, 0.1);
            width: 300px;
        }

        .mini-profile { display: flex; align-items: center; gap: 12px; }
        .mini-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #e2e8f0; }
        .btn-logout { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
        .btn-logout:hover { color: var(--primary); }

        /* --- 3. Dashboard Grid --- */
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .dashboard-hero { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3rem; }
        
        .desc-board {
            background: white; padding: 2rem; border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md); max-width: 600px; border-left: 5px solid var(--secondary);
        }
        .desc-board h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .desc-board p { color: var(--text-muted); line-height: 1.6; margin-bottom: 1.5rem; }

        .stats-row { display: flex; gap: 30px; border-top: 1px solid #edf2f7; padding-top: 1rem; }
        .stat-item h3 { font-size: 1.2rem; }
        .stat-item span { font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }

        .profile-cluster { display: flex; flex-direction: column; align-items: flex-end; gap: 15px; }
        .large-dp {
            width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
            border: 4px solid white; box-shadow: var(--shadow-lg);
        }

        .section-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        
        .gallery-item {
            position: relative; height: 300px; border-radius: var(--radius-lg);
            overflow: hidden; background: white; box-shadow: var(--shadow-sm);
            transition: all 0.4s ease; cursor: pointer;
        }
        .gallery-item:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .gallery-item:hover img { transform: scale(1.08); }
        
        .item-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white; opacity: 0; transition: 0.3s;
        }
        .gallery-item:hover .item-overlay { opacity: 1; }

        /* --- 4. MODAL & COMMENTS STYLES --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px);
            z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: white; width: 90%; max-width: 1000px; height: 85vh;
            border-radius: var(--radius-lg); overflow: hidden; display: flex; position: relative;
        }
        .modal-image-col { flex: 1.5; background: #000; display: flex; align-items: center; justify-content: center; }
        .modal-image-col img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .modal-interaction-col { flex: 1; display: flex; flex-direction: column; background: #fff; border-left: 1px solid #e2e8f0; }
        
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 10px; }
        .comment-user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .comments-list { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .single-comment { display: flex; gap: 10px; font-size: 0.9rem; }
        .single-comment .text-content { background: #f7f9fc; padding: 10px 14px; border-radius: 0 12px 12px 12px; }
        
        .comment-input-area { padding: 15px 20px; border-top: 1px solid #f1f5f9; }
        .comment-input { width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid #e2e8f0; margin-bottom: 10px; }
        .btn-post { color: var(--secondary); font-weight: 700; background: none; border: none; cursor: pointer; float: right; }
        
        .close-modal {
            position: absolute; top: 15px; right: 20px; color: white; font-size: 2rem;
            cursor: pointer; z-index: 10; background: rgba(0,0,0,0.5); width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            PhotoEngine
        </a>
        <div class="header-actions">
            <form action="search" method="get">
                <input type="text" name="search" class="search-input" placeholder="Search shots...">
            </form>
        </div>
        <div class="mini-profile">
            <a href="/logout" class="btn-logout" onclick="return confirmLogout()">Log out</a>
            <img src="{{url_for('static', filename=userdata[0][3])}}" class="mini-avatar" alt="User">
        </div>
    </header>

    <div class="container">
        <div class="dashboard-hero">
            <div class="desc-board">
                <h1>About, {{search_data[0][1]}}! 👋</h1>
                <p>{{search_data[0][5]}}</p>
                <div class="stats-row">
                    <div class="stat-item"><h3>{{ data|length }}</h3><span>Shots</span></div>
                    <div class="stat-item"><h3>2.4k</h3><span>Views</span></div>
                    <div class="stat-item"><h3>14</h3><span>Likes</span></div>
                </div>
            </div>
            <div class="profile-cluster">
                <img src="{{url_for('static', filename=search_data[0][6])}}" alt="Profile" class="large-dp">
            </div>
        </div>

        <div class="section-header">
            <div style="width: 6px; height: 30px; background: var(--primary); border-radius: 4px;"></div>
            <h2 class="section-title">Latest Shots by {{search_data[0][1]}}</h2>
        </div>
        
        <div class="gallery-grid" id="galleryGrid">
            {% for image in data %}
                <div class="gallery-item" onclick="openModal('{{url_for('static',filename=image[2])}}', '{{search_data[0][1]}}', '{{url_for('static', filename=search_data[0][6])}}','{{image[0]}}','{{uid}}')">
                    <img src="{{url_for('static',filename=image[2])}}" loading="lazy" alt="User Upload">
                    <div class="item-overlay">
                        <span>Uploaded by {{search_data[0][1]}}</span>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <div class="modal-overlay" id="imageModal">
        <div class="modal-content">
            <div class="close-modal" onclick="closeModal()">&times;</div>
            <div class="modal-image-col">
                <img id="modalImgTag" src="" alt="Full View">
            </div>
            <div class="modal-interaction-col">
                <div class="modal-header">
                    <img id="modalOwnerAvatar" src="" class="comment-user-avatar">
                    <span class="comment-user-name" id="modalOwnerName">User</span>
                </div>
                <div class="comments-list" id="commentsList"></div>
                <div class="comment-input-area">
                    <form method="post" action="/savecomment">
                        <input type="text" id="newCommentInput" class="comment-input" placeholder="Add a comment..." name="comment">
                        <input type="text" id="image_id" name="image_id" value="" hidden> 
                        <input type="text" id="user_id" name="user_id" value="" hidden>
                        <button type="submit" class="btn-post">Post</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImgTag');
        const commentsList = document.getElementById('commentsList');
        const ownerName = document.getElementById('modalOwnerName');
        const ownerAvatar = document.getElementById('modalOwnerAvatar');

        function openModal(imgSrc, user, userAvatar, image_id, uid) {
            modalImg.src = imgSrc;
            ownerName.innerText = user;
            ownerAvatar.src = userAvatar;
            document.getElementById('image_id').value = image_id;
            document.getElementById('user_id').value = uid;
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            commentshow(image_id);
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        async function commentshow(image_id) {
            commentsList.innerHTML = "Loading comments...";
            try {
                let response = await fetch(`/getcomment?id=${image_id}`);
                let image_comment = await response.json();
                commentsList.innerHTML = ""; 

                image_comment.forEach((item) => {
                    const [name, message, pic] = item;
                    commentsList.innerHTML += `
                        <div class="single-comment">
                            <img src="static/${pic}" class="comment-user-avatar" style="width:32px; height:32px;">
                            <div>
                                <div class="text-content">
                                    <strong style="font-weight:700;">${name}</strong>: ${message}
                                </div>
                            </div>
                        </div>`;
                });
            } catch (err) {
                commentsList.innerHTML = "Error loading comments.";
            }
        }

        function confirmLogout() { return confirm("Are you sure you want to log out?"); }
    </script>
</body>
</html>
